name: KOPIS 연결 점검
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 실행 서버 위치
        run: |
          curl -s https://ipinfo.io/json | grep -E '"(city|country|org)"'
      - name: KOPIS 응답 비교
        env:
          KEY: ${{ secrets.KOPIS_API_KEY }}
        run: |
          echo "키 길이: ${#KEY}"
          for u in "https://kopis.or.kr/openApi/restful/prfplc/FC003092" "https://www.kopis.or.kr/openApi/restful/prfplc/FC003092" "http://kopis.or.kr/openApi/restful/prfplc/FC003092" "https://www.kopis.or.kr/por/main/main.do"; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" -A "Mozilla/5.0" "$u?service=$KEY")
            echo "$u -> $code : $(head -c 160 /tmp/body | tr '\n' ' ')"
          done
